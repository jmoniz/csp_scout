services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csp-report-backend
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/csp_reports.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s
      start_interval: 1s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csp-report-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ORIGIN=http://localhost:3000
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
